name: invoice_pdf_generate
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  downloadsfolder: ^1.0.1
  expandable_text: ^2.3.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  get: ^4.6.6
  getwidget: ^4.0.0
  image_picker: ^1.1.1
  open_file: ^3.3.2
  path: ^1.9.0
  path_provider: ^2.1.1
  pdf: ^3.10.4
  permission_handler: ^11.3.1
  printing: ^5.12.0
  rename_app: ^1.3.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logoapp.png
  branding: assets/logoapp.png
  android_12:
    image: assets/logoapp.png
    icon_background_color: "#ffffff"
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 16

flutter:
  uses-material-design: true
  assets:
    - assets/